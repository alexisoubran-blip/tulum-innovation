<!doctype html>
<html lang="es" data-lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mis boletos | Tulum Innovation Fest 2026</title>
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#00080B" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/checkout/checkout.css?v=20261017" />
</head>
<body class="co-page">
  <header class="co-header">
    <a class="co-brand" href="/" aria-label="Tulum Innovation Fest"><img src="/assets/tulum-innovation-fest-logo.png" alt="Tulum Innovation Fest" width="150" height="40" /></a>
    <div class="co-header-right">
      <button class="co-lang" type="button" id="langToggle" aria-label="Cambiar idioma / Change language"><span data-es>EN</span><span data-en>ES</span></button>
    </div>
  </header>
  <main class="co-main" style="grid-template-columns:1fr;max-width:760px">
    <div class="co-panel">
      <div>
        <h1><span data-en>Your tickets</span><span data-es>Tus boletos</span></h1>
        <p class="co-sub"><span data-en>Tulum Innovation Fest · December 9–12, 2026 · IKAL Arena, Tulum. Show each QR at the entrance.</span><span data-es>Tulum Innovation Fest · 9 al 12 de diciembre de 2026 · IKAL Arena, Tulum. Presenta cada QR en el acceso.</span></p>
      </div>
      <div class="co-alert" id="alert" role="alert" hidden></div>
      <div class="tk-list" id="list"><p class="co-loading"><span data-en>Loading your tickets…</span><span data-es>Cargando tus boletos…</span></p></div>
      <div class="tk-actions" style="display:flex;gap:.8rem;flex-wrap:wrap">
        <button class="co-ghost" type="button" onclick="window.print()"><span data-en>Print or save as PDF</span><span data-es>Imprimir o guardar PDF</span></button>
      </div>
    </div>
  </main>
  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    let lang = new URLSearchParams(location.search).get('lang');
    try { lang = lang || localStorage.getItem('tif-language'); } catch {}
    lang = lang || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
    const set = (l) => { lang = l === 'en' ? 'en' : 'es'; root.lang = lang; root.dataset.lang = lang; };
    set(lang);
    $('langToggle').addEventListener('click', () => { set(lang === 'es' ? 'en' : 'es'); try { localStorage.setItem('tif-language', lang); } catch {} render(); });

    const M = {
      en: { of: (i, n) => `Ticket ${i} of ${n}`, valid: 'Valid', used: 'Used', void: 'Void', confirmed: 'Payment confirmed', confirmText: 'Our partnerships team will contact you within 48 hours to coordinate the benefits and deliverables.', not_paid: 'This order is not paid yet. If you just paid, wait a minute and reload.', order_not_found: 'We could not find these tickets. Check the link in your email.', default: 'We could not load your tickets. Try again in a moment.' },
      es: { of: (i, n) => `Boleto ${i} de ${n}`, valid: 'Válido', used: 'Usado', void: 'Anulado', confirmed: 'Pago confirmado', confirmText: 'Nuestro equipo de alianzas te contactará en las próximas 48 horas para coordinar los beneficios y entregables.', not_paid: 'Esta orden aún no está pagada. Si acabas de pagar, espera un minuto y recarga.', order_not_found: 'No encontramos estos boletos. Revisa el enlace de tu correo.', default: 'No pudimos cargar tus boletos. Intenta de nuevo en un momento.' },
    };
    let data = null;

    function render() {
      if (!data) return;
      const list = $('list');
      list.textContent = '';
      if (data.issuesTickets === false) {
        const card = document.createElement('article'); card.className = 'tk-ticket'; card.style.gridTemplateColumns = '1fr';
        const h = document.createElement('h2'); h.textContent = data.passName;
        const st = document.createElement('span'); st.className = 'tk-status'; st.textContent = M[lang].confirmed;
        const p = document.createElement('p'); p.className = 'tk-meta'; p.textContent = `${data.buyerName} · ${M[lang].confirmText}`;
        const box = document.createElement('div'); box.append(h, st, p); card.append(box); list.appendChild(card);
        return;
      }
      data.tickets.forEach((tk) => {
        const card = document.createElement('article');
        card.className = 'tk-ticket';
        const qr = document.createElement('div');
        qr.className = 'tk-qr';
        qr.innerHTML = tk.qrSvg; // SVG generated by our server from the ticket code
        qr.setAttribute('role', 'img');
        qr.setAttribute('aria-label', `QR ${tk.seq}`);
        const info = document.createElement('div');
        const h = document.createElement('h2'); h.textContent = data.passName;
        const meta = document.createElement('p'); meta.className = 'tk-meta'; meta.textContent = `${M[lang].of(tk.seq, data.tickets.length)} · ${tk.holder || data.buyerName}`;
        const status = document.createElement('span'); status.className = `tk-status${tk.status === 'valid' ? '' : ' is-used'}`; status.textContent = M[lang][tk.status] || tk.status;
        const code = document.createElement('p'); code.className = 'tk-code'; code.textContent = tk.code;
        info.append(h, meta, status, code);
        card.append(qr, info);
        list.appendChild(card);
      });
    }

    (async () => {
      const token = new URLSearchParams(location.search).get('t');
      let res;
      try { res = await (await fetch(`/api/checkout/tickets?t=${encodeURIComponent(token || '')}`, { cache: 'no-store' })).json(); } catch { res = { ok: false, error: 'default' }; }
      if (!res.ok) { $('list').textContent = ''; $('alert').textContent = M[lang][res.error] || M[lang].default; $('alert').hidden = false; return; }
      data = res;
      render();
    })();
  })();
  </script>
</body>
</html>
