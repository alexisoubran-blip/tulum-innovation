<!doctype html>
<html lang="es" data-lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#00080b">
  <title>Partner Welcome · Tulum Innovation Fest 2026</title>
  <meta name="description" content="Private partner page · Tulum Innovation Fest 2026 · December 9–12, Tulum.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tulum Innovation Fest">
  <meta property="og:title" content="Partner Welcome · Tulum Innovation Fest 2026">
  <meta property="og:description" content="Private partner page. December 9–12, 2026 · Tulum, Mexico.">
  <meta property="og:image" content="https://www.tuluminnovationfest.com/assets/og-passes-2026.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Private partner page in the TIF design system: Bruno Ace + Sora, ink #00080b, ember #d14414, accent #e97a43, teal panels. */
    :root{--ink:#00080b;--ink2:#020d0f;--teal:#031c20;--petrol:#042a26;--paper:#f2f1ea;--muted:#a7b1aa;--ember:#d14414;--accent:#e97a43;--orbit:#cfe9ff;--line:rgba(242,241,234,.14);--line2:rgba(242,241,234,.26);--display:"Bruno Ace","Sora",system-ui,sans-serif;--sans:"Sora",system-ui,sans-serif;--r:1.4rem}
    *{box-sizing:border-box;min-width:0}
    [hidden]{display:none!important}
    html{scroll-behavior:smooth;scroll-padding-top:84px;overflow-x:clip}
    body{margin:0;background:var(--ink);color:var(--paper);font:300 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
    img{display:block;max-width:100%}
    a{color:inherit}
    html[data-lang=es] [data-en],html[data-lang=en] [data-es]{display:none!important}
    h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
    h1,h2{text-transform:uppercase;letter-spacing:-.03em;line-height:1.04}
    h1 em,h2 em{font-style:normal;color:var(--accent)}
    h2{font-size:clamp(1.9rem,4vw,3.6rem);max-width:18ch}
    h3{font-size:1.12rem;line-height:1.25}
    p{margin:0}
    :focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .sl-wrap{width:min(1240px,calc(100% - 40px));margin-inline:auto}
    .sl-kicker{font:500 .74rem/1.4 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:1.1rem}
    .sl-rule{display:flex;align-items:center;gap:14px}.sl-rule::before{content:"";width:34px;height:1px;background:var(--ember);flex:none}
    .sl-p{color:var(--muted);max-width:60ch;margin-top:1.2rem}
    .sl-small{color:var(--muted);font-size:.86rem;margin-top:.8rem}
    .sl-fine{color:#7f8a85;font-size:.8rem;margin-top:1.6rem;max-width:90ch}
    .sl-btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:54px;padding:.9rem 1.5rem;border-radius:999px;border:1px solid transparent;font:600 .74rem/1.3 var(--sans);letter-spacing:.105em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
    .sl-btn:hover{transform:translateY(-2px)}
    .sl-btn-primary{background:var(--ember);color:var(--paper);box-shadow:0 14px 45px rgba(150,31,7,.25)}.sl-btn-primary:hover{background:#e15320}
    .sl-btn-ghost{border-color:rgba(242,241,234,.3);background:rgba(0,8,11,.3);color:var(--paper)}.sl-btn-ghost:hover{border-color:rgba(242,241,234,.6);background:rgba(242,241,234,.06)}
    .sl-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:2rem}

    /* gate */
    .gate{position:relative;min-height:100svh;display:grid;place-items:center;padding:40px 20px;overflow:hidden}
    .gate>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
    .gate::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(0,8,11,.2),var(--ink) 75%)}
    .gate-card{position:relative;z-index:1;width:min(460px,100%);text-align:center;background:rgba(2,13,15,.72);border:1px solid var(--line);border-radius:var(--r);padding:38px 30px;backdrop-filter:blur(10px)}
    .gate-card>img{height:44px;width:auto;margin:0 auto 26px}
    .gate-card h1{font-size:1.6rem;margin-bottom:.6rem}
    .gate-card p{color:var(--muted);font-size:.92rem}
    .gate form{display:grid;gap:12px;margin-top:24px}
    .gate label{font:500 .7rem var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);text-align:left}
    .gate input{width:100%;min-height:54px;border-radius:999px;border:1px solid var(--line2);background:rgba(0,8,11,.6);color:var(--paper);font:400 16px var(--sans);padding:0 22px;letter-spacing:.06em}
    .gate input:focus{border-color:var(--accent);outline:none}
    .gate .err{color:#ff9a7a;font-size:.86rem;min-height:1.4em}
    .gate .help{margin-top:18px;font-size:.8rem}
    .gate-lang{position:absolute;top:20px;right:20px;z-index:2}

    /* top */
    .sl-top{position:sticky;top:0;z-index:30;background:linear-gradient(rgba(0,8,11,.92),rgba(0,8,11,.78));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .sl-top .sl-wrap{display:flex;align-items:center;gap:20px;min-height:76px}
    .sl-lockup{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
    .sl-lockup img{height:36px;width:auto}
    .sl-x{color:var(--accent);font-size:1.1rem}
    .sl-wordmark{font:400 1rem var(--display);letter-spacing:.18em}
    .sl-nav{display:flex;gap:22px;margin-left:auto}
    .sl-nav a{font:500 .7rem var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:12px 0}
    .sl-nav a:hover{color:var(--paper)}
    .sl-lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:none}
    .sl-lang button{background:none;border:0;color:var(--muted);font:600 .7rem var(--sans);letter-spacing:.16em;padding:12px 15px;min-height:44px;cursor:pointer}
    html[data-lang=es] [data-setlang=es],html[data-lang=en] [data-setlang=en]{background:var(--paper);color:var(--ink)}
    @media(max-width:1080px){.sl-nav{display:none}.sl-lang{margin-left:auto}}
    @media(max-width:420px){.sl-lockup img{height:28px}.sl-wordmark{font-size:.8rem;letter-spacing:.1em}}

    /* hero */
    .sl-hero{position:relative;min-height:calc(100svh - 76px);display:flex;align-items:center;padding:70px 0 90px;isolation:isolate;overflow:hidden}
    .sl-sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
    .sl-sky circle{transform-box:fill-box}
    .sl-htext{max-width:640px}
    .sl-hero h1{font-size:clamp(2.3rem,5.2vw,4.6rem)}
    .sl-lede{font-size:clamp(1.02rem,1.4vw,1.18rem);color:#dcdfd8;max-width:52ch;margin-top:1.4rem}
    .sl-count{display:flex;gap:26px;margin-top:2.4rem}
    .sl-count div{display:grid}
    .sl-count b{font:400 clamp(2rem,3.6vw,3rem)/1 var(--display)}
    .sl-count div>span{font:500 .66rem var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px}
    .sl-credit{position:absolute;left:20px;bottom:14px;font-size:.7rem;color:rgba(242,241,234,.5)}
    @media(max-width:759px){.sl-hero{align-items:flex-start;padding:48px 0 340px;min-height:0}}
    .sl-facts{border-block:1px solid var(--line);background:var(--ink2)}
    .sl-facts .sl-wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
    .sl-facts div{padding:22px 20px 22px 0;border-right:1px solid var(--line);display:grid;gap:4px}
    .sl-facts div+div{padding-left:22px}.sl-facts div:last-child{border:0}
    .sl-facts div>span{font:500 .66rem var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
    .sl-facts b{font-weight:500}
    @media(max-width:860px){.sl-facts .sl-wrap{grid-template-columns:1fr 1fr}.sl-facts div{border:0;padding:16px 10px 16px 0!important}}

    /* bands */
    .sl-band{padding:clamp(72px,9vw,128px) 0}
    .sl-teal{background:linear-gradient(180deg,var(--teal),var(--ink2))}
    .sl-split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,5vw,72px);align-items:center}
    .sl-photo{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
    .sl-photo img{width:100%;height:100%;object-fit:cover}
    .sl-tall{aspect-ratio:4/5}
    .sl-stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:2.4rem}
    .sl-stats3 div{border-top:1px solid var(--ember);padding-top:14px}
    .sl-stats3 b,.sl-nums b,.sl-kpis b{display:block;font:400 clamp(1.8rem,3vw,2.6rem)/1 var(--display);color:var(--paper)}
    .sl-stats3 span,.sl-nums span{display:block;color:var(--muted);font-size:.88rem;margin-top:10px}
    @media(max-width:900px){.sl-split{grid-template-columns:1fr}.sl-tall{aspect-ratio:16/10}}
    @media(max-width:560px){.sl-stats3{grid-template-columns:1fr}}
    .sl-story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);margin-top:2.6rem;align-items:start}
    .sl-tl{list-style:none;margin:0;padding:0}
    .sl-tl li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:22px 0;border-top:1px solid var(--line)}
    .sl-tl li>b{font:400 1.3rem var(--display);color:var(--accent)}
    .sl-tl p{color:var(--muted);font-size:.95rem;margin-top:6px}
    .sl-mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:200px 200px;gap:10px}
    .sl-mosaic img{width:100%;height:100%;object-fit:cover;border-radius:1rem}
    .sl-mosaic img:nth-child(3){grid-row:1/3;grid-column:2}
    .sl-mosaic img:nth-child(1){grid-column:1}
    .sl-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:3rem}
    .sl-nums div{border-top:1px solid var(--line2);padding-top:16px}
    @media(max-width:900px){.sl-story{grid-template-columns:1fr}.sl-nums{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.sl-tl li{grid-template-columns:1fr;gap:4px}.sl-mosaic{grid-template-rows:150px 150px}}

    /* program */
    .sl-days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:2.8rem}
    .sl-day{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:rgba(242,241,234,.025);overflow:hidden}
    .sl-day header{padding:24px 22px 8px;position:relative}
    .sl-day .sl-kicker{margin-bottom:.4rem;font-size:.66rem}
    .sl-daynum{position:absolute;right:18px;top:16px;font:400 2.4rem/1 var(--display);color:rgba(242,241,234,.12)}
    .sl-day ul{list-style:none;margin:0;padding:10px 22px 20px;flex:1;color:var(--muted);font-size:.92rem}
    .sl-day li{padding:6px 0;border-bottom:1px solid rgba(242,241,234,.07)}
    .sl-moment{background:linear-gradient(140deg,rgba(209,68,20,.2),rgba(4,42,38,.5));border-top:1px solid var(--line);padding:18px 22px 22px;font-size:.9rem}
    .sl-moment b{display:block;font:600 .66rem var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--orbit);margin-bottom:6px}
    @media(max-width:1040px){.sl-days{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.sl-days{grid-template-columns:1fr}}

    /* activations */
    .sl-acts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:2.8rem}
    .sl-act{grid-column:span 2;position:relative;min-height:380px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;isolation:isolate}
    .sl-act.wide{grid-column:span 3;min-height:420px}
    .sl-act img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s}
    .sl-act:hover img{transform:scale(1.04)}
    .sl-act::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,8,11,.05) 20%,rgba(0,8,11,.92) 72%)}
    .sl-act>div{padding:26px;display:grid;gap:10px}
    .sl-act p{color:#cfd4ce;font-size:.92rem}
    .sl-tag{justify-self:start;font:600 .64rem var(--sans);letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:7px 12px;background:rgba(209,68,20,.22);border:1px solid rgba(233,122,67,.5);color:#ffd0b6;white-space:nowrap}
    @media(max-width:1000px){.sl-act,.sl-act.wide{grid-column:span 3}}
    @media(max-width:640px){.sl-acts{grid-template-columns:1fr}.sl-act,.sl-act.wide{grid-column:auto;min-height:360px}}

    /* whale */
    .sl-whale{position:relative;padding:clamp(80px,10vw,140px) 0;overflow:hidden;isolation:isolate}
    .sl-whale>img,.sl-contact>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .sl-whale::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,8,11,.94) 30%,rgba(0,8,11,.35))}

    /* audience */
    .sl-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:2.8rem}
    .sl-kpis>div,.sl-panel{border:1px solid var(--line);border-radius:var(--r);background:rgba(242,241,234,.03);padding:24px}
    .sl-kpis h3{margin-top:14px;font-size:.95rem}
    .sl-kpis p{color:var(--muted);font-size:.85rem;margin-top:4px}
    .sl-aud{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .sl-panel h3{margin-bottom:18px}
    .sl-bar{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 3.6em;gap:12px;align-items:center;font-size:.9rem;padding:6px 0}
    .sl-bar i{height:8px;border-radius:9px;background:rgba(242,241,234,.08);position:relative;overflow:hidden}
    .sl-bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--ember),var(--accent))}
    .sl-bar b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
    .sl-split-bar{display:flex;height:10px;border-radius:9px;overflow:hidden;margin-top:18px}
    .sl-split-bar i:first-child{background:var(--ember)}.sl-split-bar i:last-child{background:var(--orbit)}
    @media(max-width:900px){.sl-kpis{grid-template-columns:1fr 1fr}.sl-aud{grid-template-columns:1fr}}
    @media(max-width:480px){.sl-bar{grid-template-columns:minmax(0,1fr) 3.4em}.sl-bar i{grid-column:1/-1;order:3}}

    /* people */
    .sl-sub{font-size:.8rem;font-family:var(--sans);font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:2.6rem 0 1.1rem}
    .sl-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
    .sl-person{margin:0;display:flex;gap:12px;align-items:center}
    .sl-person img{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line2)}
    .sl-person figcaption{display:grid;font-size:.86rem;line-height:1.35}
    .sl-person small{color:var(--muted);font-size:.76rem}
    .sl-people-big{grid-template-columns:repeat(4,minmax(0,1fr))}
    .sl-big{flex-direction:column;align-items:stretch;gap:12px}
    .sl-big img{width:100%;height:auto;aspect-ratio:1;border-radius:1rem}
    .sl-two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
    .sl-two .sl-people{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
    .sl-quote{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:center;margin-top:4rem;padding-top:3rem;border-top:1px solid var(--line)}
    .sl-quote>img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);filter:grayscale(1)}
    .sl-quote blockquote{margin:0;font:400 clamp(1.3rem,2.4vw,2rem)/1.3 var(--display)}
    .sl-press{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;margin:1.6rem 0;color:var(--muted);font-size:.85rem}
    .sl-press img{height:26px;width:auto;filter:brightness(0) invert(1);opacity:.85}
    @media(max-width:900px){.sl-people-big{grid-template-columns:1fr 1fr}.sl-two{grid-template-columns:1fr;gap:0}.sl-quote{grid-template-columns:1fr}.sl-quote>img{width:140px}}

    /* tiers */
    .sl-tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 8px;margin-top:2rem;scrollbar-width:thin}
    .sl-tabs button{flex:none;position:relative;display:grid;gap:3px;text-align:left;cursor:pointer;min-height:66px;padding:12px 18px;border-radius:1rem;border:1px solid var(--line);background:rgba(242,241,234,.03);color:var(--paper);font:inherit}
    .sl-tabs button b{font:400 .9rem var(--display)}
    .sl-tabs button small{color:var(--muted);font-size:.78rem}
    .sl-tabs button[aria-selected=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
    .sl-fit{position:absolute;top:-10px;right:12px;font:700 .6rem var(--sans);letter-spacing:.12em;text-transform:uppercase;font-style:normal;background:var(--orbit);color:var(--ink);border-radius:999px;padding:3px 9px}
    .sl-tier{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:36px;margin-top:12px;border:1px solid var(--line);border-top:2px solid var(--acc);border-radius:var(--r);background:rgba(242,241,234,.03);padding:clamp(24px,3.4vw,42px)}
    .sl-tier h3{font-size:1.6rem;text-transform:uppercase}
    .sl-tier-sum{color:var(--muted);margin-top:6px}
    .sl-price{font:400 clamp(2.4rem,4.6vw,3.6rem)/1 var(--display);color:var(--accent);margin-top:1.4rem}
    .sl-price-s{font-size:2rem;margin:0 0 .6rem}
    .sl-tax{color:var(--muted);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
    .sl-why{margin:1.4rem 0;padding:14px 16px;border-radius:1rem;background:rgba(207,233,255,.08);border:1px solid rgba(207,233,255,.2);font-size:.9rem;color:#e3f1ff}
    .sl-tier dl{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin:0}
    .sl-tier dt{font:500 .64rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .sl-tier dd{margin:4px 0 0;font-size:.95rem}
    @media(max-width:860px){.sl-tier{grid-template-columns:1fr}}
    @media(max-width:500px){.sl-tier dl{grid-template-columns:1fr}}
    .sl-compare{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:4px 22px}
    .sl-compare summary{cursor:pointer;padding:16px 0;font:600 .74rem var(--sans);letter-spacing:.14em;text-transform:uppercase}
    .sl-scroll{overflow-x:auto;padding-bottom:16px}
    .sl-compare table{border-collapse:collapse;min-width:980px;width:100%;font-size:.82rem}
    .sl-compare th,.sl-compare td{text-align:left;vertical-align:top;padding:11px 10px;border-top:1px solid var(--line)}
    .sl-compare thead th{border:0;font-family:var(--display);font-weight:400;color:var(--accent)}
    .sl-compare tbody th{font-weight:400;color:var(--muted);width:14%}

    /* passes, steps */
    .sl-passes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:2.8rem}
    .sl-passes ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:.92rem}
    .sl-passes li{display:flex;gap:10px}.sl-passes li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember);margin-top:.6em;flex:none}
    .sl-passes li.no{color:#78827d}.sl-passes li.no::before{background:#3b4441}
    @media(max-width:900px){.sl-passes{grid-template-columns:1fr}}
    .sl-steps{list-style:none;margin:2.8rem 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .sl-steps li{border-top:2px solid var(--ember);padding-top:20px}
    .sl-steps .sl-n{font:400 1rem var(--display);font-style:normal;color:var(--accent)}
    .sl-steps h3{margin:10px 0 8px;text-transform:uppercase;font-size:1rem}
    .sl-steps p{color:var(--muted);font-size:.9rem}
    .sl-measure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:2.4rem}
    .sl-measure div{border:1px solid var(--line);border-radius:1rem;padding:18px 20px}
    .sl-measure b{font:600 .68rem var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--orbit)}
    .sl-measure p{color:var(--muted);font-size:.88rem;margin-top:6px}

  <script>
  {
    const root = document.documentElement, $ = s => document.querySelector(s);
    const KEY = 'tif-partner-starlink';
    let lang = 'es';
    try { lang = localStorage.getItem('tif-lang') || lang; } catch (e) {}
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'es') lang = q;
    const setLang = l => { lang = l; root.dataset.lang = l; root.lang = l; try { localStorage.setItem('tif-lang', l); } catch (e) {} tick(); };
    document.addEventListener('click', ev => { const b = ev.target.closest('[data-setlang]'); if (b) setLang(b.dataset.setlang); });

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function unlock(pass) {
      const box = JSON.parse($('#locked').textContent);
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(box.salt), iterations: box.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.data));
      return new TextDecoder().decode(plain);
    }
    async function attempt(pass, silent) {
      try {
        const html = await unlock(pass);
        try { sessionStorage.setItem(KEY, pass); } catch (e) {}
        $('#app').innerHTML = html; $('#app').hidden = false; $('#gate').remove();
        document.title = 'Starlink × Tulum Innovation Fest 2026';
        init();
        if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
      } catch (e) {
        try { sessionStorage.removeItem(KEY); } catch (_) {}
        if (!silent) $('#gate-err').innerHTML = '<span data-es>Clave incorrecta. Intenta de nuevo.</span><span data-en>Wrong code. Please try again.</span>';
      }
    }
    $('#gate-form').addEventListener('submit', ev => { ev.preventDefault(); $('#gate-err').textContent = ''; attempt($('#gate-key').value, false); });

    let tick = () => {};
    function init() {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      // hero sky: photo anchored bottom-right, orbit sky above it, text column kept clear
      const hero = $('.sl-hero'), sky = $('#sky');
      if (hero && sky) {
        if (reduce && sky.pauseAnimations) sky.pauseAnimations();
        const fit = () => {
          const W = hero.clientWidth, H = hero.clientHeight;
          let s, x0;
          if (W < 760) { s = W / 1250; x0 = 1060 - W / (2 * s); }
          else { s = Math.min(W / 1920, H * 0.66 / 1280); x0 = 1920 - W / s; }
          const y0 = 1280 - H / s;
          sky.setAttribute('viewBox', `${x0.toFixed(1)} ${y0.toFixed(1)} ${(W / s).toFixed(1)} ${(H / s).toFixed(1)}`);
          sky.setAttribute('preserveAspectRatio', 'none');
        };
        const skyObserver = new ResizeObserver(fit); skyObserver.observe(hero); fit();
      }
      // countdown
      const c = $('[data-count]');
      if (c) {
        const start = Date.parse(c.dataset.count);
        tick = () => {
          const d = start - Date.now();
          if (d <= 0) { c.innerHTML = '<div><b>LIVE</b><span><span data-es>En vivo en Tulum</span><span data-en>Live in Tulum</span></span></div>'; return; }
          const u = [[Math.floor(d / 864e5), 'Días', 'Days'], [Math.floor(d / 36e5) % 24, 'Horas', 'Hours'], [Math.floor(d / 6e4) % 60, 'Min', 'Min']];
          c.innerHTML = u.map(([n, es, en]) => `<div><b>${String(n).padStart(2, '0')}</b><span><span data-es>${es}</span><span data-en>${en}</span></span></div>`).join('');
        };
        tick(); setInterval(tick, 20000);
      }
      // tier tabs
      const tabs = [...document.querySelectorAll('.sl-tabs [role=tab]')];
      const select = (t, focus) => {
        tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; });
        if (focus) { t.focus(); t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
      };
      tabs.forEach((t, i) => {
        t.addEventListener('click', () => select(t));
        t.addEventListener('keydown', ev => {
          if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
          ev.preventDefault(); select(tabs[(i + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length], true);
        });
      });
    }
    setLang(lang);
    let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) attempt(saved, true);
  }
  </script>
</body>
